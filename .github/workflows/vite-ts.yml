name: Deploy static content to Pages
on:
  push:
    branches: ['main']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: 'pages'
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: 'npm'
          cache-dependency-path: my-pages/package-lock.json
      - name: Install dependencies
        working-directory: my-pages
        run: npm ci
      - name: Build
        working-directory: my-pages
        run: npm run build
      - name: Assemble site
        run: |
          mkdir -p site
          rsync -a --exclude='.git' --exclude='.github' --exclude='my-pages' --exclude='site' ./ site/
          mkdir -p site/my-pages
          cp -r my-pages/dist/. site/my-pages/
      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: site
          keep_files: true